# dsh-duty — bundle patch layer
#
# 1) duty：主插件（工具 + 定时器）
# 2) duty-worker-preset：执行器 Session 的 agent preset
#
# 为什么要有 preset：工单执行器不该拿到「提问 / 呈现 / 排程 / 目标 / 工作流 / 插件管理」这些工具，
# 也不该能再起子代理（防递归）。工具面由 preset 决定，而不是靠提示词求它别用。
#
# 刻意不传 config 给 duty：本插件不导出 Config（schemastery）schema，
# 那会引入对 @deepseek-ai/* 的运行时依赖，而 link: 安装的插件解析不到 profile 的 node_modules。
# 运行期配置改读 ~/.dsh/duty/config.json，见 README。
- insert:
    - id: duty
      name: 'dsh-duty'

    # 执行器 preset。名字/描述写清「不供手动选择」——preset 选择器没有隐藏开关。
    - id: duty-worker-preset
      name: '@deepseek-ai/dsh-agent-preset'
      config:
        id: duty-worker
        name: 值班执行器
        description: dsh-duty 的工单执行器专用，不供手动选择。只含执行工作所需的工具，前台命令超 5 秒转后台。
        order: 90
        plugins:
          - id: persona
            name: '@deepseek-ai/dsh-persona'
            config:
              prefix: You are a coding agent powered by the {{model}} model.
          - id: agent-instructions
            name: '@deepseek-ai/dsh-agent-instructions'
            config:
              maxBytes: 65536
          - id: time-context
            name: '@deepseek-ai/dsh-time-context'
          # 前台命令只等 5 秒，超时转后台：不让一条长命令把工单卡死。
          - id: shell
            name: cordis:group
            group: true
            isolate:
              shell: true
            config:
              - id: bash-sandbox
                name: '@deepseek-ai/dsh-bash-sandbox'
                disabled: !!js process.platform === 'win32'
                config:
                  timeoutMs: 5000
                  maxTimeoutMs: 5000
              - id: pwsh-sandbox
                name: '@deepseek-ai/dsh-pwsh-sandbox'
                disabled: !!js process.platform !== 'win32'
                config:
                  timeoutMs: 5000
                  maxTimeoutMs: 5000
              - id: tool-bash
                name: '@deepseek-ai/dsh-tool-bash'
                disabled: !!js process.platform === 'win32'
              - id: tool-pwsh
                name: '@deepseek-ai/dsh-tool-pwsh'
                disabled: !!js process.platform !== 'win32'
          - id: tool-fs
            name: '@deepseek-ai/dsh-tool-fs'
          - id: tool-fs-search
            name: '@deepseek-ai/dsh-tool-fs-search'
            config:
              sampleOverCapGlobResults: false
          - id: tool-jobs
            name: '@deepseek-ai/dsh-tool-jobs'
            config:
              waitTimeoutMs: 5000
              maxWaitTimeoutMs: 5000
          - id: skill-filesystem
            name: '@deepseek-ai/dsh-skill-filesystem'
          - id: tool-skill
            name: '@deepseek-ai/dsh-tool-skill'
          - id: compaction
            name: cordis:group
            group: true
            isolate:
              compaction: true
              toolResultPruner: true
            config:
              - id: compaction-basic
                name: '@deepseek-ai/dsh-compaction-basic'
              - id: tool-result-pruner
                name: '@deepseek-ai/dsh-compaction-tool-result-pruner'
                config:
                  thresholdChars: 8192
                  headChars: 4096
                  tailChars: 1024
          - id: tool-todo
            name: '@deepseek-ai/dsh-tool-todo'
            config:
              allowParallelInProgress: true
          # 刻意**不给** tool-web：执行器不需要外网检索，给了就是一条出网的旁路。
          # preset 自带的工具无法用 tools.restrict 收回（它们不在可收敛集合里），
          # 只能靠「不挂」来控制 —— 这是本 preset 工具面的唯一真相来源。
          # 必须在最后：在 agent 作用域内调 ctx.tools.restrict()，把 profile 级插件注册的
          # 全局工具（AgentTeams / Mnemon / Soul / Memory / duty 自己）收回去。
          - id: duty-tool-filter
            name: 'dsh-duty/tool-filter'
